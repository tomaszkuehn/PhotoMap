<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhotoMap</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="pin"></span>PhotoMap</div>
    <div class="spacer"></div>
    <button id="openBtn">Open folder&hellip;</button>
  </header>
  <div id="map"></div>
  <div id="status" class="chip">Pick a folder with geotagged photos to start</div>

  <div id="overlay" hidden>
    <div class="ov-back"></div>
    <figure class="ov-card">
      <img id="ov-img" alt="">
      <figcaption>
        <div id="ov-name"></div>
        <div id="ov-meta"></div>
      </figcaption>
      <button id="ov-close" aria-label="Close">&#10005;</button>
    </figure>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script src="main.js"></script>
</body>
</html>
