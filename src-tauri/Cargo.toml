[package]
name = "photomap"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
walkdir = "2"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
strip = true
